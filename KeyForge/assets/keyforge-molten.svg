<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <linearGradient id="lavaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="70%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </linearGradient>
    <linearGradient id="moltenMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="25%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <linearGradient id="cooledMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a6e7a"/>
      <stop offset="100%" stop-color="#3a3d45"/>
    </linearGradient>
    <linearGradient id="pourStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="30%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <linearGradient id="crucibleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a2a"/>
      <stop offset="100%" stop-color="#2a1a0a"/>
    </linearGradient>
    <linearGradient id="heatWave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff450030"/>
      <stop offset="100%" stop-color="#ff450000"/>
    </linearGradient>
    <radialGradient id="pourGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffd70040"/>
      <stop offset="100%" stop-color="#ff450000"/>
    </radialGradient>
    <filter id="mGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mHeavyGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heatDistort">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="turb">
        <animate attributeName="baseFrequency" values="0.02;0.03;0.02" dur="3s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="2"/>
    </filter>
    <!-- Key mold shape -->
    <clipPath id="keyMold1"><rect x="0" y="0" width="36" height="36" rx="5"/></clipPath>
    <clipPath id="keyMold2"><rect x="0" y="0" width="36" height="36" rx="5"/></clipPath>
  </defs>

  <style>
    @keyframes pourFlow {
      0% { transform: scaleY(0); opacity: 0; }
      10% { transform: scaleY(1); opacity: 1; }
      90% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(0); opacity: 0; }
    }
    @keyframes moldFill {
      0%, 15% { fill: #1a1a1a; }
      20% { fill: #ff4500; }
      40% { fill: #ff8c00; }
      60% { fill: #ffd700; }
      75% { fill: #ff6a00; }
      85% { fill: #cc5500; }
      92% { fill: #7a6a5a; }
      100% { fill: #5a5e6a; }
    }
    @keyframes moldGlow {
      0%, 15% { filter: none; }
      20%, 60% { filter: url(#mHeavyGlow); }
      80% { filter: url(#mGlow); }
      100% { filter: none; }
    }
    @keyframes crucibleTilt {
      0%, 20% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(-25deg); }
      80%, 100% { transform: rotate(0deg); }
    }
    @keyframes steamRise {
      0% { opacity: 0.6; transform: translateY(0) scaleX(1); }
      100% { opacity: 0; transform: translateY(-40px) scaleX(1.5); }
    }
    @keyframes letterCool {
      0% { fill: #ffd700; filter: url(#mHeavyGlow); }
      30% { fill: #ff8c00; filter: url(#mGlow); }
      60% { fill: #cc6600; }
      80% { fill: #8a8e9a; }
      100% { fill: #e0e4f0; filter: none; }
    }
    @keyframes charReveal {
      0%, 5% { opacity: 0; }
      6% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes drip {
      0%, 80% { transform: translateY(0); opacity: 0; }
      82% { opacity: 1; }
      100% { transform: translateY(20px); opacity: 0; }
    }
    @keyframes conveyorMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-48px); }
    }
    @keyframes heatShimmer {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.5; }
    }
    @keyframes splashDot {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
    }
    @keyframes progressFill {
      0% { width: 0; }
      100% { width: 140px; }
    }
    @keyframes temp {
      0%, 100% { fill: #ff4500; }
      50% { fill: #ffd700; }
    }
    @keyframes moldSequence1 {
      0%, 100% { fill: #1a1a1a; filter: none; }
      5%, 15% { fill: #ffd700; filter: url(#mHeavyGlow); }
      25%, 35% { fill: #ff8c00; filter: url(#mGlow); }
      45% { fill: #8a8e9a; filter: none; }
    }
    @keyframes moldSequence2 {
      0%, 100% { fill: #1a1a1a; filter: none; }
      15%, 25% { fill: #ffd700; filter: url(#mHeavyGlow); }
      35%, 45% { fill: #ff8c00; filter: url(#mGlow); }
      55% { fill: #8a8e9a; filter: none; }
    }
    @keyframes moldSequence3 {
      0%, 100% { fill: #1a1a1a; filter: none; }
      25%, 35% { fill: #ffd700; filter: url(#mHeavyGlow); }
      45%, 55% { fill: #ff8c00; filter: url(#mGlow); }
      65% { fill: #8a8e9a; filter: none; }
    }
    @keyframes moldSequence4 {
      0%, 100% { fill: #1a1a1a; filter: none; }
      35%, 45% { fill: #ffd700; filter: url(#mHeavyGlow); }
      55%, 65% { fill: #ff8c00; filter: url(#mGlow); }
      75% { fill: #8a8e9a; filter: none; }
    }
    @keyframes moldSequence5 {
      0%, 100% { fill: #1a1a1a; filter: none; }
      45%, 55% { fill: #ffd700; filter: url(#mHeavyGlow); }
      65%, 75% { fill: #ff8c00; filter: url(#mGlow); }
      85% { fill: #8a8e9a; filter: none; }
    }

    .title-letter { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 58px; }
    .tl1 { opacity: 0; animation: charReveal 8s ease forwards 0.5s; }
    .tl2 { opacity: 0; animation: charReveal 8s ease forwards 0.65s; }
    .tl3 { opacity: 0; animation: charReveal 8s ease forwards 0.78s; }
    .tl4 { opacity: 0; animation: charReveal 8s ease forwards 1.1s; }
    .tl5 { opacity: 0; animation: charReveal 8s ease forwards 1.25s; }
    .tl6 { opacity: 0; animation: charReveal 8s ease forwards 1.38s; }
    .tl7 { opacity: 0; animation: charReveal 8s ease forwards 1.5s; }
    .tl8 { opacity: 0; animation: charReveal 8s ease forwards 1.65s; }
    .cool1 { animation: letterCool 4s ease forwards 0.5s; }
    .cool2 { animation: letterCool 4s ease forwards 0.65s; }
    .cool3 { animation: letterCool 4s ease forwards 0.78s; }
    .cool4 { animation: letterCool 4s ease forwards 1.1s; }
    .cool5 { animation: letterCool 4s ease forwards 1.25s; }
    .cool6 { animation: letterCool 4s ease forwards 1.38s; }
    .cool7 { animation: letterCool 4s ease forwards 1.5s; }
    .cool8 { animation: letterCool 4s ease forwards 1.65s; }

    .steam { animation: steamRise 2s ease-out infinite; }
    .st1 { animation-delay: 0s; }
    .st2 { animation-delay: 0.4s; }
    .st3 { animation-delay: 0.8s; }
    .st4 { animation-delay: 1.2s; }
    .st5 { animation-delay: 1.6s; }

    .heat-wave { animation: heatShimmer 2s ease-in-out infinite; }
    .mold-s1 { animation: moldSequence1 6s ease infinite; }
    .mold-s2 { animation: moldSequence2 6s ease infinite; }
    .mold-s3 { animation: moldSequence3 6s ease infinite; }
    .mold-s4 { animation: moldSequence4 6s ease infinite; }
    .mold-s5 { animation: moldSequence5 6s ease infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="340" rx="12" fill="url(#lavaBg)"/>

  <!-- Heat shimmer at bottom -->
  <rect x="0" y="250" width="800" height="90" rx="12" fill="url(#heatWave)" class="heat-wave"/>

  <!-- ===== FURNACE (left) ===== -->
  <g transform="translate(40, 100)">
    <!-- Furnace body -->
    <rect x="0" y="20" width="120" height="100" rx="6" fill="#1a1410" stroke="#3a2a1a" stroke-width="1.5"/>
    <!-- Furnace opening (arch) -->
    <path d="M15,70 Q15,30 60,30 Q105,30 105,70" fill="#0d0805" stroke="#3a2a1a" stroke-width="1"/>
    <!-- Fire glow inside -->
    <ellipse cx="60" cy="68" rx="38" ry="20" fill="#ff4500" opacity="0.15" filter="url(#mHeavyGlow)">
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Inner fire layers -->
    <ellipse cx="60" cy="65" rx="28" ry="12" fill="#ff6a00" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="62" rx="18" ry="8" fill="#ff8c00" opacity="0.4">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="60" rx="10" ry="5" fill="#ffd700" opacity="0.5">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="1s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Bricks -->
    <line x1="0" y1="55" x2="15" y2="55" stroke="#2a1a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="105" y1="55" x2="120" y2="55" stroke="#2a1a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="80" x2="15" y2="80" stroke="#2a1a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="105" y1="80" x2="120" y2="80" stroke="#2a1a0a" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="100" x2="120" y2="100" stroke="#2a1a0a" stroke-width="0.5" opacity="0.4"/>
    <!-- Chimney -->
    <rect x="45" y="0" width="30" height="24" rx="2" fill="#1a1410" stroke="#3a2a1a" stroke-width="1"/>
    <!-- Smoke wisps from chimney -->
    <circle cx="55" cy="-5" r="4" fill="#4a4a4a" opacity="0.15">
      <animate attributeName="cy" values="-5;-25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="-2" r="3" fill="#4a4a4a" opacity="0.1">
      <animate attributeName="cy" values="-2;-22" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== KEY MOLDS (center-bottom) ===== -->
  <g transform="translate(200, 210)">
    <text x="0" y="-8" font-family="Consolas, monospace" font-size="9" fill="#5a4a3a" letter-spacing="1">CASTING MOLDS</text>

    <!-- Mold tray -->
    <rect x="-8" y="2" width="230" height="50" rx="4" fill="#1a1410" stroke="#3a2a1a" stroke-width="1"/>

    <!-- Individual key molds -->
    <g transform="translate(6, 10)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5" class="mold-s1"/>
      <text x="16" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3a3a3a" opacity="0.5">H</text>
    </g>
    <g transform="translate(48, 10)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5" class="mold-s2"/>
      <text x="16" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3a3a3a" opacity="0.5">e</text>
    </g>
    <g transform="translate(90, 10)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5" class="mold-s3"/>
      <text x="16" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3a3a3a" opacity="0.5">l</text>
    </g>
    <g transform="translate(132, 10)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5" class="mold-s4"/>
      <text x="16" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3a3a3a" opacity="0.5">l</text>
    </g>
    <g transform="translate(174, 10)">
      <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.5" class="mold-s5"/>
      <text x="16" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3a3a3a" opacity="0.5">o</text>
    </g>
  </g>

  <!-- ===== TITLE ===== -->
  <g filter="url(#mGlow)">
    <text x="400" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="58px">
      <tspan fill="#e0e4f0">Key</tspan><tspan fill="#ff8c00">Forge</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="148" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#5a4a3a" letter-spacing="3">
    CAST IN MOLTEN PRECISION
  </text>

  <!-- Steam wisps above letters -->
  <g opacity="0.4" filter="url(#heatDistort)">
    <ellipse cx="290" cy="55" rx="8" ry="4" fill="#ff8c0020" class="steam st1"/>
    <ellipse cx="360" cy="50" rx="10" ry="5" fill="#ff8c0020" class="steam st2"/>
    <ellipse cx="430" cy="58" rx="7" ry="3" fill="#ff8c0020" class="steam st3"/>
    <ellipse cx="490" cy="52" rx="9" ry="4" fill="#ff8c0020" class="steam st4"/>
    <ellipse cx="340" cy="48" rx="6" ry="3" fill="#ff8c0020" class="steam st5"/>
  </g>

  <!-- ===== RIGHT: Temperature gauge ===== -->
  <g transform="translate(590, 160)">
    <!-- Gauge background -->
    <rect x="0" y="0" width="160" height="130" rx="6" fill="#111111" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Header -->
    <text x="80" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#5a5a5a" letter-spacing="1">FORGE STATUS</text>
    <line x1="10" y1="26" x2="150" y2="26" stroke="#2a2a2a" stroke-width="0.5"/>

    <!-- Temperature -->
    <text x="12" y="44" font-family="Consolas, monospace" font-size="8" fill="#6a6a6a">TEMP</text>
    <text x="100" y="44" font-family="Consolas, monospace" font-size="10" fill="#ff4500" font-weight="bold" style="animation: temp 2s ease infinite;">1,482°C</text>

    <!-- Flow rate -->
    <text x="12" y="62" font-family="Consolas, monospace" font-size="8" fill="#6a6a6a">FLOW</text>
    <text x="100" y="62" font-family="Consolas, monospace" font-size="10" fill="#ff8c00">92 WPM</text>

    <!-- Accuracy -->
    <text x="12" y="80" font-family="Consolas, monospace" font-size="8" fill="#6a6a6a">FIDELITY</text>
    <text x="100" y="80" font-family="Consolas, monospace" font-size="10" fill="#00cc44">98.7%</text>

    <!-- Progress bar -->
    <text x="12" y="100" font-family="Consolas, monospace" font-size="8" fill="#6a6a6a">CASTING</text>
    <rect x="12" y="106" width="136" height="8" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="0.5"/>
    <rect x="13" y="107" width="0" height="6" rx="1.5" fill="#ff6a00" style="animation: progressFill 4s ease infinite;">
      <animate attributeName="fill" values="#ff4500;#ffd700;#ff4500" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Lava line at bottom -->
  <g>
    <line x1="30" y1="300" x2="770" y2="300" stroke="#ff450015" stroke-width="2"/>
    <!-- Drips -->
    <circle cx="200" cy="300" r="2" fill="#ff4500" opacity="0" style="animation: drip 3s ease infinite 0s;"/>
    <circle cx="400" cy="300" r="1.5" fill="#ff6a00" opacity="0" style="animation: drip 3s ease infinite 1s;"/>
    <circle cx="600" cy="300" r="2" fill="#ff4500" opacity="0" style="animation: drip 3s ease infinite 2s;"/>
  </g>

  <!-- Bottom text -->
  <text x="400" y="326" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2a2020" letter-spacing="1">
    MOLTEN DATA → FORGED KEYSTROKES → HUMAN OUTPUT
  </text>

  <!-- Corner heat marks -->
  <circle cx="20" cy="20" r="3" fill="#ff4500" opacity="0.1"/>
  <circle cx="780" cy="20" r="3" fill="#ff4500" opacity="0.1"/>
  <circle cx="20" cy="320" r="3" fill="#ff4500" opacity="0.15"/>
  <circle cx="780" cy="320" r="3" fill="#ff4500" opacity="0.15"/>
</svg>