<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <!-- Forge glow gradient -->
    <radialGradient id="forgeGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff6a0020"/>
      <stop offset="100%" stop-color="#0d111700"/>
    </radialGradient>
    <!-- Key gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e37"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </linearGradient>
    <!-- Active key gradient -->
    <linearGradient id="keyActiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#e0520e"/>
    </linearGradient>
    <!-- Timing bar gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="50%" stop-color="#ff9e44"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <!-- Subtitle gradient -->
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8fa8"/>
      <stop offset="100%" stop-color="#6b7094"/>
    </linearGradient>
    <!-- Spark filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes typing {
      0%, 5% { opacity: 0; }
      6%, 100% { opacity: 1; }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes keyPress {
      0%, 100% { opacity: 0; }
      8%, 20% { opacity: 1; }
      40% { opacity: 0; }
    }
    @keyframes barGrow {
      0% { width: 0; }
      100% { width: 100%; }
    }
    @keyframes spark {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes dataStream {
      0% { opacity: 0; transform: translateX(-10px); }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateX(10px); }
    }
    @keyframes waveBar {
      0%, 100% { height: 4px; y: 8px; }
      50% { height: 16px; y: 2px; }
    }

    .title-char { opacity: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #f0f2f8; }
    .title-char-accent { opacity: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ff8c42; }

    .char-K { animation: typing 4s ease forwards; animation-delay: 0.3s; }
    .char-e { animation: typing 4s ease forwards; animation-delay: 0.48s; }
    .char-y { animation: typing 4s ease forwards; animation-delay: 0.55s; }
    .char-F { animation: typing 4s ease forwards; animation-delay: 0.85s; }
    .char-o { animation: typing 4s ease forwards; animation-delay: 0.96s; }
    .char-r { animation: typing 4s ease forwards; animation-delay: 1.08s; }
    .char-g { animation: typing 4s ease forwards; animation-delay: 1.18s; }
    .char-ee { animation: typing 4s ease forwards; animation-delay: 1.32s; }

    .cursor {
      animation: cursor-blink 0.85s step-end infinite;
      animation-delay: 0.3s;
    }

    .subtitle {
      opacity: 0;
      animation: slideUp 0.8s ease forwards;
      animation-delay: 1.8s;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #7a7f98;
      letter-spacing: 3px;
    }

    .key-cap {
      rx: 4; ry: 4;
      stroke: #3a3f4b;
      stroke-width: 1;
    }
    .key-letter {
      font-family: 'Segoe UI', monospace;
      font-size: 11px;
      fill: #6b7084;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Key press animations - staggered */
    .kp1 { animation: keyPress 4s ease infinite; animation-delay: 0.3s; }
    .kp2 { animation: keyPress 4s ease infinite; animation-delay: 0.48s; }
    .kp3 { animation: keyPress 4s ease infinite; animation-delay: 0.55s; }
    .kp4 { animation: keyPress 4s ease infinite; animation-delay: 0.85s; }
    .kp5 { animation: keyPress 4s ease infinite; animation-delay: 0.96s; }
    .kp6 { animation: keyPress 4s ease infinite; animation-delay: 1.08s; }
    .kp7 { animation: keyPress 4s ease infinite; animation-delay: 1.18s; }
    .kp8 { animation: keyPress 4s ease infinite; animation-delay: 1.32s; }

    /* Timing bars */
    .timing-bar {
      opacity: 0;
      animation: fadeIn 0.3s ease forwards;
    }
    .tb1 { animation-delay: 2.2s; }
    .tb2 { animation-delay: 2.35s; }
    .tb3 { animation-delay: 2.5s; }
    .tb4 { animation-delay: 2.65s; }
    .tb5 { animation-delay: 2.8s; }
    .tb6 { animation-delay: 2.95s; }
    .tb7 { animation-delay: 3.1s; }
    .tb8 { animation-delay: 3.25s; }

    .data-label {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      fill: #4a4f62;
    }

    .forge-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .wave-bar {
      fill: #ff6a00;
      opacity: 0.4;
    }
    .wb1 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0s; }
    .wb2 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.1s; }
    .wb3 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.2s; }
    .wb4 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.3s; }
    .wb5 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.4s; }
    .wb6 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.5s; }
    .wb7 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.6s; }
    .wb8 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.7s; }
    .wb9 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.8s; }
    .wb10 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 0.9s; }
    .wb11 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 1.0s; }
    .wb12 { animation: waveBar 1.2s ease-in-out infinite; animation-delay: 1.1s; }

    .stream-dot {
      animation: dataStream 2s ease infinite;
    }
    .sd1 { animation-delay: 0s; }
    .sd2 { animation-delay: 0.2s; }
    .sd3 { animation-delay: 0.4s; }
    .sd4 { animation-delay: 0.6s; }
    .sd5 { animation-delay: 0.8s; }
  </style>

  <!-- Background -->
  <rect width="800" height="340" rx="12" fill="#0d1117"/>
  <rect width="800" height="340" rx="12" fill="url(#forgeGlow)" class="forge-glow"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- ===== LEFT: Mini Keyboard ===== -->
  <g transform="translate(50, 90)" opacity="0.7">
    <!-- Row 1: Q W E R T -->
    <rect x="0" y="0" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="14" y="14" class="key-letter">Q</text>
    <rect x="32" y="0" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="46" y="14" class="key-letter">W</text>
    <rect x="64" y="0" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="78" y="14" class="key-letter">E</text>
    <rect x="96" y="0" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="110" y="14" class="key-letter">R</text>
    <rect x="128" y="0" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="142" y="14" class="key-letter">T</text>

    <!-- Row 2: A S D F G -->
    <rect x="6" y="32" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="20" y="46" class="key-letter">A</text>
    <rect x="38" y="32" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="52" y="46" class="key-letter">S</text>
    <rect x="70" y="32" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="84" y="46" class="key-letter">D</text>
    <rect x="102" y="32" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="116" y="46" class="key-letter">F</text>
    <rect x="134" y="32" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="148" y="46" class="key-letter">G</text>

    <!-- Row 3: Z X C V B -->
    <rect x="14" y="64" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="28" y="78" class="key-letter">Z</text>
    <rect x="46" y="64" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="60" y="78" class="key-letter">X</text>
    <rect x="78" y="64" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="92" y="78" class="key-letter">C</text>
    <rect x="110" y="64" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="124" y="78" class="key-letter">V</text>
    <rect x="142" y="64" width="28" height="28" class="key-cap" fill="url(#keyGrad)"/>
    <text x="156" y="78" class="key-letter">B</text>

    <!-- Animated key presses (glow overlays) -->
    <!-- K = Row 1 area, approximate -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp1" opacity="0" filter="url(#glow)"/>
    <rect x="64" y="0" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp2" opacity="0" filter="url(#glow)"/>
    <rect x="0" y="0" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp3" opacity="0" filter="url(#glow)"/><!-- Y mapped to Q row -->
    <rect x="102" y="32" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp4" opacity="0" filter="url(#glow)"/>
    <rect x="38" y="32" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp5" opacity="0" filter="url(#glow)"/><!-- O -->
    <rect x="96" y="0" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp6" opacity="0" filter="url(#glow)"/>
    <rect x="134" y="32" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp7" opacity="0" filter="url(#glow)"/>
    <rect x="64" y="0" width="28" height="28" rx="4" fill="url(#keyActiveGrad)" class="kp8" opacity="0" filter="url(#glow)"/>
  </g>

  <!-- ===== CENTER: Title ===== -->
  <g transform="translate(400, 120)">
    <!-- "Key" in white -->
    <text x="-118" y="0" class="title-char char-K">K</text>
    <text x="-86" y="0" class="title-char char-e">e</text>
    <text x="-60" y="0" class="title-char char-y">y</text>
    <!-- "Forge" in accent -->
    <text x="-22" y="0" class="title-char-accent char-F">F</text>
    <text x="8" y="0" class="title-char-accent char-o">o</text>
    <text x="36" y="0" class="title-char-accent char-r">r</text>
    <text x="56" y="0" class="title-char-accent char-g">g</text>
    <text x="86" y="0" class="title-char-accent char-ee">e</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="158" text-anchor="middle" class="subtitle">HUMAN-LIKE KEYSTROKE SYNTHESIS</text>

  <!-- ===== RIGHT: Timing Visualization ===== -->
  <g transform="translate(590, 90)">
    <!-- Timing bars representing keystroke intervals -->
    <g class="timing-bar tb1">
      <text x="0" y="8" class="data-label">K</text>
      <rect x="16" y="0" width="85" height="10" rx="2" fill="#ff6a00" opacity="0.8"/>
      <text x="108" y="8" class="data-label">142ms</text>
    </g>
    <g class="timing-bar tb2" transform="translate(0, 16)">
      <text x="0" y="8" class="data-label">e</text>
      <rect x="16" y="0" width="52" height="10" rx="2" fill="#ff8c42" opacity="0.7"/>
      <text x="74" y="8" class="data-label">87ms</text>
    </g>
    <g class="timing-bar tb3" transform="translate(0, 32)">
      <text x="0" y="8" class="data-label">y</text>
      <rect x="16" y="0" width="38" height="10" rx="2" fill="#ffaa66" opacity="0.6"/>
      <text x="60" y="8" class="data-label">63ms</text>
    </g>
    <g class="timing-bar tb4" transform="translate(0, 48)">
      <text x="0" y="8" class="data-label">F</text>
      <rect x="16" y="0" width="110" height="10" rx="2" fill="#ff6a00" opacity="0.85"/>
      <text x="132" y="8" class="data-label">195ms</text>
    </g>
    <g class="timing-bar tb5" transform="translate(0, 64)">
      <text x="0" y="8" class="data-label">o</text>
      <rect x="16" y="0" width="60" height="10" rx="2" fill="#ff8c42" opacity="0.7"/>
      <text x="82" y="8" class="data-label">98ms</text>
    </g>
    <g class="timing-bar tb6" transform="translate(0, 80)">
      <text x="0" y="8" class="data-label">r</text>
      <rect x="16" y="0" width="45" height="10" rx="2" fill="#ffaa66" opacity="0.6"/>
      <text x="67" y="8" class="data-label">72ms</text>
    </g>
    <g class="timing-bar tb7" transform="translate(0, 96)">
      <text x="0" y="8" class="data-label">g</text>
      <rect x="16" y="0" width="68" height="10" rx="2" fill="#ff8c42" opacity="0.7"/>
      <text x="90" y="8" class="data-label">108ms</text>
    </g>
    <g class="timing-bar tb8" transform="translate(0, 112)">
      <text x="0" y="8" class="data-label">e</text>
      <rect x="16" y="0" width="55" height="10" rx="2" fill="#ffaa66" opacity="0.65"/>
      <text x="77" y="8" class="data-label">91ms</text>
    </g>
  </g>

  <!-- ===== BOTTOM: Audio-style waveform ===== -->
  <g transform="translate(255, 270)" opacity="0.5">
    <rect x="0" y="8" width="3" height="4" rx="1" class="wave-bar wb1"/>
    <rect x="7" y="4" width="3" height="12" rx="1" class="wave-bar wb2"/>
    <rect x="14" y="2" width="3" height="16" rx="1" class="wave-bar wb3"/>
    <rect x="21" y="6" width="3" height="8" rx="1" class="wave-bar wb4"/>
    <rect x="28" y="3" width="3" height="14" rx="1" class="wave-bar wb5"/>
    <rect x="35" y="7" width="3" height="6" rx="1" class="wave-bar wb6"/>

    <!-- Arrow -->
    <line x1="48" y1="10" x2="68" y2="10" stroke="#ff6a00" stroke-width="1" opacity="0.5"/>
    <polygon points="68,6 76,10 68,14" fill="#ff6a00" opacity="0.5"/>

    <!-- CSV icon -->
    <rect x="86" y="0" width="40" height="20" rx="3" fill="none" stroke="#ff6a00" stroke-width="1" opacity="0.5"/>
    <text x="106" y="14" font-family="Consolas, monospace" font-size="8" fill="#ff8c42" text-anchor="middle" opacity="0.7">.csv</text>

    <!-- Arrow -->
    <line x1="136" y1="10" x2="156" y2="10" stroke="#ff6a00" stroke-width="1" opacity="0.5"/>
    <polygon points="156,6 164,10 156,14" fill="#ff6a00" opacity="0.5"/>

    <!-- Keyboard icon -->
    <rect x="174" y="0" width="38" height="20" rx="3" fill="none" stroke="#ff6a00" stroke-width="1" opacity="0.5"/>
    <rect x="178" y="4" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="186" y="4" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="194" y="4" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="202" y="4" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="180" y="11" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="188" y="11" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>
    <rect x="196" y="11" width="6" height="5" rx="1" fill="#ff6a00" opacity="0.3"/>

    <!-- Right side waveform -->
    <rect x="222" y="8" width="3" height="4" rx="1" class="wave-bar wb7"/>
    <rect x="229" y="3" width="3" height="14" rx="1" class="wave-bar wb8"/>
    <rect x="236" y="5" width="3" height="10" rx="1" class="wave-bar wb9"/>
    <rect x="243" y="2" width="3" height="16" rx="1" class="wave-bar wb10"/>
    <rect x="250" y="6" width="3" height="8" rx="1" class="wave-bar wb11"/>
    <rect x="257" y="4" width="3" height="12" rx="1" class="wave-bar wb12"/>
  </g>

  <!-- Bottom tagline -->
  <text x="400" y="320" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3a3f52" letter-spacing="1">
    generate · synthesize · type
  </text>

  <!-- Decorative corner accents -->
  <line x1="16" y1="16" x2="16" y2="36" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="16" y1="16" x2="36" y2="16" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="784" y1="16" x2="784" y2="36" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="784" y1="16" x2="764" y2="16" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="16" y1="324" x2="16" y2="304" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="16" y1="324" x2="36" y2="324" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="784" y1="324" x2="784" y2="304" stroke="#ff6a0040" stroke-width="1"/>
  <line x1="784" y1="324" x2="764" y2="324" stroke="#ff6a0040" stroke-width="1"/>
</svg>