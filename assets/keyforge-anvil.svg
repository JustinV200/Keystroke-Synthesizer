<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ff6a00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4e5a"/>
      <stop offset="50%" stop-color="#2a2d35"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a5e6a"/>
      <stop offset="100%" stop-color="#3a3d45"/>
    </linearGradient>
    <linearGradient id="moltenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="30%" stop-color="#ff8c00"/>
      <stop offset="60%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="moltenVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <filter id="emberGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heavyGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#ff6a00" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sparkClip"><rect x="0" y="0" width="800" height="340"/></clipPath>
  </defs>

  <style>
    @keyframes hammerStrike {
      0%, 60% { transform: rotate(0deg) translate(0, 0); }
      70% { transform: rotate(-25deg) translate(-5px, -20px); }
      80% { transform: rotate(0deg) translate(0, 0); }
      85% { transform: rotate(-15deg) translate(-3px, -12px); }
      92% { transform: rotate(0deg) translate(0, 0); }
      100% { transform: rotate(0deg) translate(0, 0); }
    }
    @keyframes sparkFly1 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(-40px, -60px); }
    }
    @keyframes sparkFly2 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(20px, -70px); }
    }
    @keyframes sparkFly3 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(-60px, -30px); }
    }
    @keyframes sparkFly4 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(50px, -50px); }
    }
    @keyframes sparkFly5 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(-20px, -80px); }
    }
    @keyframes sparkFly6 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(35px, -40px); }
    }
    @keyframes sparkFly7 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(-50px, -55px); }
    }
    @keyframes sparkFly8 {
      0% { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(10px, -90px); }
    }
    @keyframes fireFlicker {
      0%, 100% { opacity: 0.6; transform: scaleY(1); }
      25% { opacity: 0.8; transform: scaleY(1.05); }
      50% { opacity: 0.5; transform: scaleY(0.95); }
      75% { opacity: 0.9; transform: scaleY(1.08); }
    }
    @keyframes moltenPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes letterForge {
      0% { fill: #ff4500; filter: url(#heavyGlow); }
      30% { fill: #ffd700; }
      70% { fill: #ff8c00; }
      100% { fill: #c8ccd8; filter: none; }
    }
    @keyframes charAppear {
      0%, 5% { opacity: 0; transform: translateY(4px); }
      6% { opacity: 1; transform: translateY(0); }
      100% { opacity: 1; }
    }
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes emberFloat {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      50% { opacity: 0.4; }
      100% { opacity: 0; transform: translateY(-50px) scale(0.3); }
    }
    @keyframes anvilShake {
      0%, 60% { transform: translate(0,0); }
      80% { transform: translate(1px, 0); }
      82% { transform: translate(-1px, 0); }
      84% { transform: translate(1px, 0); }
      86% { transform: translate(0, 0); }
      100% { transform: translate(0,0); }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .hammer { transform-origin: 280px 140px; animation: hammerStrike 2.5s ease-in-out infinite; }
    .anvil-body { animation: anvilShake 2.5s ease-in-out infinite; }

    .spark { filter: url(#emberGlow); }
    .s1 { animation: sparkFly1 0.8s ease-out infinite; animation-delay: 0.8s; opacity: 0; }
    .s2 { animation: sparkFly2 0.7s ease-out infinite; animation-delay: 0.82s; opacity: 0; }
    .s3 { animation: sparkFly3 0.9s ease-out infinite; animation-delay: 0.85s; opacity: 0; }
    .s4 { animation: sparkFly4 0.6s ease-out infinite; animation-delay: 0.78s; opacity: 0; }
    .s5 { animation: sparkFly5 0.75s ease-out infinite; animation-delay: 0.83s; opacity: 0; }
    .s6 { animation: sparkFly6 0.85s ease-out infinite; animation-delay: 0.9s; opacity: 0; }
    .s7 { animation: sparkFly7 0.65s ease-out infinite; animation-delay: 0.87s; opacity: 0; }
    .s8 { animation: sparkFly8 0.7s ease-out infinite; animation-delay: 0.81s; opacity: 0; }

    .s1b { animation: sparkFly1 0.8s ease-out infinite; animation-delay: 2.05s; opacity: 0; }
    .s2b { animation: sparkFly2 0.7s ease-out infinite; animation-delay: 2.07s; opacity: 0; }
    .s3b { animation: sparkFly3 0.9s ease-out infinite; animation-delay: 2.1s; opacity: 0; }
    .s4b { animation: sparkFly4 0.6s ease-out infinite; animation-delay: 2.03s; opacity: 0; }
    .s5b { animation: sparkFly5 0.75s ease-out infinite; animation-delay: 2.08s; opacity: 0; }

    .fire { animation: fireFlicker 1.5s ease-in-out infinite; transform-origin: center bottom; }

    .title-k { opacity: 0; animation: charAppear 6s ease forwards 0.8s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-e1 { opacity: 0; animation: charAppear 6s ease forwards 0.95s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-y { opacity: 0; animation: charAppear 6s ease forwards 1.05s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-f { opacity: 0; animation: charAppear 6s ease forwards 1.35s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-o { opacity: 0; animation: charAppear 6s ease forwards 1.5s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-r { opacity: 0; animation: charAppear 6s ease forwards 1.6s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-g { opacity: 0; animation: charAppear 6s ease forwards 1.72s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }
    .title-e2 { opacity: 0; animation: charAppear 6s ease forwards 1.85s; font-family: 'Georgia', 'Times New Roman', serif; font-weight: 900; font-size: 56px; }

    .forged-letter { animation: letterForge 3s ease forwards; }
    .fl1 { animation-delay: 0.8s; }
    .fl2 { animation-delay: 0.95s; }
    .fl3 { animation-delay: 1.05s; }
    .fl4 { animation-delay: 1.35s; }
    .fl5 { animation-delay: 1.5s; }
    .fl6 { animation-delay: 1.6s; }
    .fl7 { animation-delay: 1.72s; }
    .fl8 { animation-delay: 1.85s; }

    .subtitle { opacity: 0; animation: fadeSlideUp 1s ease forwards 2.5s; }

    .ember { animation: emberFloat 2s ease-out infinite; }
    .em1 { animation-delay: 0s; }
    .em2 { animation-delay: 0.4s; }
    .em3 { animation-delay: 0.8s; }
    .em4 { animation-delay: 1.2s; }
    .em5 { animation-delay: 1.6s; }

    .data-line { stroke-dasharray: 4 4; animation: dataFlow 1s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="340" rx="12" fill="#0a0c10"/>
  <rect width="800" height="340" rx="12" fill="url(#fireGlow)"/>

  <!-- Floating embers -->
  <g clip-path="url(#sparkClip)">
    <circle cx="150" cy="280" r="2" fill="#ff6a00" class="ember em1" opacity="0"/>
    <circle cx="300" cy="290" r="1.5" fill="#ff8c00" class="ember em2" opacity="0"/>
    <circle cx="500" cy="285" r="1.8" fill="#ffa500" class="ember em3" opacity="0"/>
    <circle cx="650" cy="275" r="1.2" fill="#ff6a00" class="ember em4" opacity="0"/>
    <circle cx="400" cy="295" r="2" fill="#ff4500" class="ember em5" opacity="0"/>
  </g>

  <!-- ===== ANVIL ===== -->
  <g class="anvil-body" transform="translate(80, 160)">
    <!-- Anvil base -->
    <path d="M40,80 L20,120 L140,120 L120,80 Z" fill="url(#anvilGrad)" stroke="#3a3e4a" stroke-width="1"/>
    <!-- Anvil body -->
    <rect x="30" y="50" width="100" height="32" rx="2" fill="url(#anvilGrad)" stroke="#3a3e4a" stroke-width="1"/>
    <!-- Anvil face (top) -->
    <rect x="20" y="38" width="120" height="14" rx="3" fill="#4a4e5a" stroke="#5a5e6a" stroke-width="0.5"/>
    <!-- Anvil horn -->
    <path d="M20,42 Q-10,44 -20,45 L20,50 Z" fill="#3a3d45" stroke="#4a4e5a" stroke-width="0.5"/>
    <!-- Highlight on face -->
    <rect x="25" y="39" width="110" height="3" rx="1" fill="#5a5e6a" opacity="0.5"/>

    <!-- Molten keystroke on anvil -->
    <g filter="url(#heavyGlow)">
      <rect x="55" y="28" width="18" height="12" rx="2" fill="url(#moltenGrad)" opacity="0.9">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== HAMMER ===== -->
  <g class="hammer">
    <!-- Handle -->
    <rect x="195" y="100" width="6" height="65" rx="2" fill="#5a4a3a" transform="rotate(-15, 198, 132)"/>
    <!-- Head -->
    <rect x="175" y="90" width="46" height="22" rx="4" fill="url(#hammerGrad)" stroke="#5a5e6a" stroke-width="0.5" transform="rotate(-15, 198, 101)"/>
    <!-- Head shine -->
    <rect x="180" y="92" width="36" height="4" rx="2" fill="#6a6e7a" opacity="0.4" transform="rotate(-15, 198, 94)"/>
  </g>

  <!-- ===== SPARKS (from first strike) ===== -->
  <g clip-path="url(#sparkClip)">
    <circle cx="158" cy="198" r="2.5" fill="#ffd700" class="spark s1"/>
    <circle cx="158" cy="198" r="2" fill="#ffaa00" class="spark s2"/>
    <circle cx="158" cy="198" r="1.8" fill="#ffd700" class="spark s3"/>
    <circle cx="158" cy="198" r="2.2" fill="#ff8c00" class="spark s4"/>
    <circle cx="158" cy="198" r="1.5" fill="#ffd700" class="spark s5"/>
    <circle cx="158" cy="198" r="2" fill="#ffcc00" class="spark s6"/>
    <circle cx="158" cy="198" r="1.8" fill="#ffa500" class="spark s7"/>
    <circle cx="158" cy="198" r="2.3" fill="#ffd700" class="spark s8"/>
    <!-- Second strike sparks -->
    <circle cx="158" cy="198" r="2" fill="#ffd700" class="spark s1b"/>
    <circle cx="158" cy="198" r="1.5" fill="#ffaa00" class="spark s2b"/>
    <circle cx="158" cy="198" r="2.2" fill="#ffd700" class="spark s3b"/>
    <circle cx="158" cy="198" r="1.8" fill="#ff8c00" class="spark s4b"/>
    <circle cx="158" cy="198" r="2" fill="#ffcc00" class="spark s5b"/>
  </g>

  <!-- ===== Forge fire underneath ===== -->
  <g transform="translate(80, 278)" class="fire" opacity="0.6">
    <ellipse cx="80" cy="5" rx="50" ry="8" fill="#ff4500" opacity="0.2" filter="url(#heavyGlow)"/>
    <ellipse cx="80" cy="0" rx="30" ry="5" fill="#ff6a00" opacity="0.3"/>
  </g>

  <!-- ===== TITLE ===== -->
  <g filter="url(#textGlow)">
    <text x="345" y="115" class="title-k forged-letter fl1" fill="#ff4500">K</text>
    <text x="380" y="115" class="title-e1 forged-letter fl2" fill="#ff4500">e</text>
    <text x="408" y="115" class="title-y forged-letter fl3" fill="#ff4500">y</text>
    <text x="448" y="115" class="title-f forged-letter fl4" fill="#ff4500">F</text>
    <text x="482" y="115" class="title-o forged-letter fl5" fill="#ff4500">o</text>
    <text x="514" y="115" class="title-r forged-letter fl6" fill="#ff4500">r</text>
    <text x="538" y="115" class="title-g forged-letter fl7" fill="#ff4500">g</text>
    <text x="570" y="115" class="title-e2 forged-letter fl8" fill="#ff4500">e</text>
  </g>

  <!-- Cursor -->
  <rect x="598" y="76" width="3" height="46" fill="#ff6a00" rx="1">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="490" y="148" text-anchor="middle" class="subtitle"
        font-family="'Georgia', serif" font-size="14" fill="#6a5a4a" letter-spacing="4">
    FORGED KEYSTROKES • HUMAN PRECISION
  </text>

  <!-- ===== DATA OUTPUT (right side) ===== -->
  <g transform="translate(560, 180)" class="subtitle" opacity="0.6">
    <!-- Terminal-style output -->
    <rect x="0" y="0" width="200" height="120" rx="6" fill="#111318" stroke="#2a2d35" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="200" height="20" rx="6" fill="#1a1d24"/>
    <rect x="0" y="10" width="200" height="10" fill="#1a1d24"/>
    <circle cx="14" cy="10" r="3.5" fill="#ff5f56" opacity="0.7"/>
    <circle cx="28" cy="10" r="3.5" fill="#ffbd2e" opacity="0.7"/>
    <circle cx="42" cy="10" r="3.5" fill="#27c93f" opacity="0.7"/>

    <!-- Terminal text -->
    <text x="12" y="40" font-family="Consolas, monospace" font-size="9" fill="#4a9eff">$</text>
    <text x="22" y="40" font-family="Consolas, monospace" font-size="9" fill="#8a8fa0"> keyforge generate</text>

    <text x="12" y="56" font-family="Consolas, monospace" font-size="8.5" fill="#5a5e6a">⚒ Forging keystrokes...</text>

    <text x="12" y="72" font-family="Consolas, monospace" font-size="8.5" fill="#3a8a3a">✓</text>
    <text x="22" y="72" font-family="Consolas, monospace" font-size="8.5" fill="#5a5e6a"> press: H  dt:132ms</text>

    <text x="12" y="84" font-family="Consolas, monospace" font-size="8.5" fill="#3a8a3a">✓</text>
    <text x="22" y="84" font-family="Consolas, monospace" font-size="8.5" fill="#5a5e6a"> press: e  dt:87ms</text>

    <text x="12" y="96" font-family="Consolas, monospace" font-size="8.5" fill="#3a8a3a">✓</text>
    <text x="22" y="96" font-family="Consolas, monospace" font-size="8.5" fill="#5a5e6a"> press: l  dt:64ms</text>

    <text x="12" y="108" font-family="Consolas, monospace" font-size="8.5" fill="#ff8c42">▌</text>
    <text x="20" y="108" font-family="Consolas, monospace" font-size="8.5" fill="#5a5e6a">forging...</text>
  </g>

  <!-- Connection line from anvil to terminal -->
  <line x1="250" y1="230" x2="555" y2="250" stroke="#ff6a00" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4" class="data-line"/>

  <!-- Bottom bar decoration -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#1a1d24" stroke-width="1"/>
  <line x1="300" y1="320" x2="500" y2="320" stroke="#ff6a00" stroke-width="1" opacity="0.2"/>

  <!-- Decorative corner brackets -->
  <path d="M16,30 L16,16 L30,16" fill="none" stroke="#ff450040" stroke-width="1"/>
  <path d="M770,16 L784,16 L784,30" fill="none" stroke="#ff450040" stroke-width="1"/>
  <path d="M16,310 L16,324 L30,324" fill="none" stroke="#ff450040" stroke-width="1"/>
  <path d="M770,324 L784,324 L784,310" fill="none" stroke="#ff450040" stroke-width="1"/>
</svg>